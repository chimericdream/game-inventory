# Production stack: app + Postgres. Copy .env.example to .env and set POSTGRES_PASSWORD first.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: games
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U games -d games']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://games:${POSTGRES_PASSWORD}@db:5432/games
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      # Set to true once the app is served over HTTPS (e.g. tailscale serve).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
