name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --passWithNoTests
      - run: pnpm build

  e2e:
    name: e2e
    needs: e2e-shards
    # Always reports, so the required "e2e" check on main never waits forever, and fails
    # unless every shard succeeded. Shard count can change without touching branch protection.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shards.result }}" = "success"

  e2e-shards:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each shard gets its own Postgres service, app instance and database, so the specs stay
    # isolated from each other without any test changes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: games
          POSTGRES_PASSWORD: games
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U games"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      # Only go to apt when a system library is actually missing, so an Ubuntu mirror outage
      # does not fail the build when the runner image already has what the browser needs.
      - name: Install browser system dependencies if missing
        run: |
          missing=0
          for bin in $(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \)); do
            if ldd "$bin" | grep -q 'not found'; then
              echo "Missing libraries for $bin:"; ldd "$bin" | grep 'not found'
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then pnpm exec playwright install-deps chromium; fi
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            e2e/.tmp/report
            e2e/.tmp/test-results
          retention-days: 7

  # Publishes the image only when everything above passed, on pushes to main.
  # The Proxmox host's Watchtower picks up the new :latest.
  publish:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
