# Marketing site (game-shelf.app). Netlify builds from the repository root so the site can reuse
# the app's theme, fonts and shelf components from ./src. The app itself is never deployed here.
[build]
command = "npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm --filter game-shelf-site build"
publish = "site/out"
# Skip the build when nothing the site uses has changed (exit 0 = skip).
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site src/theme.ts src/fonts.ts src/fonts src/components/shelf netlify.toml pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
