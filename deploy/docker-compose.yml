# Runs on the Proxmox Docker host (copy this directory there). Then:
#   cp .env.example .env     # set TS_AUTHKEY and POSTGRES_PASSWORD
#   docker compose up -d
# The app is served over HTTPS at https://games.<tailnet>.ts.net. Watchtower pulls new images of
# the app (only containers with the enable label) every 5 minutes; Postgres is never auto-updated.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: games-tailscale
    hostname: games
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'true'
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: games-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: games
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U games -d games']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/chimericdream/game-inventory:latest
    container_name: games-app
    # Shares the tailscale container's network so `tailscale serve` can proxy to localhost:3000.
    # `db` still resolves because that namespace is on the compose network.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://games:${POSTGRES_PASSWORD}@db:5432/games
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      COOKIE_SECURE: 'true'
    volumes:
      - app-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: games-watchtower
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  ts-state:
  db-data:
  app-data:
